[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "im-hub"
version = "1.0.0rc4"
description = "CLI-only local IM collection, query and evidence hub; no mandatory LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
visual = ["pillow>=10", "opencv-python-headless>=4.10", "pywinauto>=0.6.9; sys_platform == 'win32'"]
crypto = ["cryptography>=41"]
windows = ["pywin32==312; sys_platform == 'win32'", "uiautomation==2.0.29; sys_platform == 'win32'"]
build = ["build==1.6.1", "pyinstaller==6.22.3"]

[project.scripts]
im-hub = "im_hub.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["im_hub*"]

[tool.setuptools.package-data]
im_hub = ["offline_guard.mjs"]
